name: Trigger auto deployment for startup-twin-backend

# DRAFT for the monorepo layout — not installed/active anywhere yet.
# Key change vs. the standalone-repo version: the Docker build context must
# now be the MONOREPO ROOT (so pnpm can resolve pnpm-workspace.yaml +
# @cybranex/shared-types), not the backend directory alone. appSourcePath
# and dockerfilePath below reflect that; everything else is unchanged.

on:
  push:
    branches:
      [ main ]
    paths:
      - 'apps/backend/**'
      - 'packages/shared-types/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.STARTUPTWINBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.STARTUPTWINBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.STARTUPTWINBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ./apps/backend/Dockerfile
          registryUrl: startupdigitaltwin123.azurecr.io
          registryUsername: ${{ secrets.STARTUPTWINBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.STARTUPTWINBACKEND_REGISTRY_PASSWORD }}
          containerAppName: startup-twin-backend
          resourceGroup: startup-digital-twin-rg
          imageToBuild: startupdigitaltwin123.azurecr.io/startup-twin-backend:${{ github.sha }}
